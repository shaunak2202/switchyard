name: switchyard

# Every open connection is a file descriptor. Docker's default soft limit (1024) is below what
# the gateway needs (clients + a pool per provider + Redis) and caps the mocks under load
# (ADR-018).
x-ulimits: &ulimits
  nofile: { soft: 65536, hard: 65536 }

x-healthcheck: &http-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 5s

services:
  gateway:
    build:
      context: .
      target: gateway
      args:
        # `make up SEMANTIC=1` bakes in torch + the semantic-cache models (~2.5 GB).
        SEMANTIC: ${SEMANTIC:-false}
    image: switchyard-gateway:dev
    ulimits: *ulimits
    env_file:
      - path: .env
        required: false
    environment:
      SWITCHYARD_CONFIG: /app/config/gateway.yaml
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mock-primary: { condition: service_healthy }
      mock-secondary: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *http-healthcheck
      start_period: 30s  # loading the embedding and verifier models
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]

  mock-primary: &mock
    build: { context: ., target: mock }
    image: switchyard-mock:dev
    ulimits: *ulimits
    environment:
      MOCK_TTFT_MS: ${MOCK_TTFT_MS:-50}
      MOCK_INTER_TOKEN_MS: ${MOCK_INTER_TOKEN_MS:-5}
      MOCK_OUTPUT_TOKENS: ${MOCK_OUTPUT_TOKENS:-32}
    ports:
      - "9001:9000"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]

  mock-secondary:
    <<: *mock
    ports:
      - "9002:9000"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      gateway: { condition: service_healthy }

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Local development only: anonymous read-only access to the provisioned dashboard.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/switchyard.json
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "redis-cli", "ping"]
